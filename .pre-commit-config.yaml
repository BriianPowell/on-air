repos:
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-fmt-repo
        args: [-w]
        files: ^agent/
      - id: go-mod-tidy-repo
        files: ^agent/go\.(mod|sum)$
      - id: go-vet-repo-mod
        files: ^agent/
      - id: go-build-repo-mod
        files: ^agent/

  - repo: local
    hooks:
      - id: go-test-all
        name: go-test-all
        entry: >
          bash -c 'export PATH="${HOME}/.goenv/shims:${HOME}/.goenv/bin:${PATH}"
          && go test ./agent/... ./protocol/...'
        language: system
        pass_filenames: false
        always_run: true

      - id: go-revive
        name: go-revive
        entry: >
          bash -c 'export PATH="${HOME}/.goenv/shims:${HOME}/.goenv/bin:${PATH}"
          && cd agent && go tool revive -config=revive.toml ./...'
        language: system
        pass_filenames: false
        files: (^agent/.*\.go$|^agent/revive\.toml$)
