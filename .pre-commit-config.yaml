repos:
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-fmt-repo
        args: [-w]
      - id: go-mod-tidy-repo
      - id: go-vet-repo-mod
      - id: go-test-repo-mod
      - id: go-build-repo-mod

  - repo: local
    hooks:
      - id: go-revive
        name: go-revive
        entry: >
          bash -c 'export PATH="${HOME}/.goenv/shims:${HOME}/.goenv/bin:${PATH}"
          && go tool revive -config=revive.toml ./...'
        language: system
        pass_filenames: false
        files: '(\.go$|revive\.toml$)'
