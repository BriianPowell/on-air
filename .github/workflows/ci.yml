name: CI

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: agent

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/.go-version
          cache-dependency-path: agent/go.sum

      - name: Download modules and tools
        run: go mod download

      - name: go fmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go revive
        run: go tool revive -config=revive.toml ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/.go-version
          cache-dependency-path: agent/go.sum

      - name: go build
        run: go build ./...
