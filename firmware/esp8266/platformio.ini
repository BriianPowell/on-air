; ESP8266 firmware for the on-air sign (WS2812 + MQTT)

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit NeoPixel@^1.15.1

build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-I ${PROJECT_DIR}/../../protocol

; Alternate board — same GPIO2 / D4 LED pin
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit NeoPixel@^1.15.1

build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-I ${PROJECT_DIR}/../../protocol

[platformio]
default_envs = nodemcuv2
