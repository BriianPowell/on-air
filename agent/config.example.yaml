# Unique ID for this laptop/person. Used in the MQTT topic and JSON payload.
device: brian-mac

mqtt:
  # Local: tcp://homeassistant.local:1883
  # Remote (TLS): ssl://mqtt.example.com:443
  broker: tcp://homeassistant.local:1883
  topic: on-air/brian-mac
  client_id: on-air-agent-brian-mac
  username: ''
  password: ''
  # Optional TLS overrides (broker ssl:// enables TLS automatically):
  # tls:
  #   ca_file: /path/to/ca.pem
  #   insecure_skip_verify: false

# Optional: only publish active mic/camera state when this machine has a local
# interface IP in one of these networks. Use your home LAN and/or VPN-assigned
# network. Leave empty to publish from any network.
# allowed_networks:
#   - 10.0.2.0/24
#   - 10.16.24.0/24

# How often to poll mic/camera state.
poll_interval: 1s

# Mic or camera must be active this long before turning the sign on.
on_debounce: 3s

# Both must be idle this long before turning the sign off.
off_debounce: 10s

# Multi-user: one agent per laptop (brian-mac, lauren-win), each with its own topic.
